# Unified JEPA model + training — architecture_v5.md §3-§5, unified_jepa/Phase 3
# Phase 4 MD: guidance + physics loop integration
# architecture_id: unified_occ_param_spectrum_jepa_v1

# Scalar convention (Phase 1 MD §3: store the verified convention in config/
# checkpoint metadata — do not re-derive or normalize scalars twice).
# Network input stays RAW/unscaled — operator decision 2026-09-13 (AUDIT_REPORT_192D §4).
scalar_convention:
  parameter_order: ["l_lattice", "h_atom", "r_atom"]
  parameter_index_in_dataset: [0, 1, 2]
  broadcast_channel:
    l_lattice: {channel: 2, divisor: 3.0, dense: true}
    h_atom: {channel: 1, divisor: 1.0, dense: false}
    r_atom: {channel: 0, divisor: 5.0, dense: false}
  factorized_scalar_representation: raw physical values (not rescaled)

# (no `variant` key: the unified architecture is the only live path, audit B17)
hidden: 192
num_heads: 6
geo_depth: 6
predictor_depth: 8
goal_tokens: 16
num_predictor_heads: 6
scalar_hidden: 128
n_film_blocks: 6
spec_dim: 256
ema_momentum_start: 0.996
ema_momentum_end: 0.999

# Loss weights per Phase 3 MD §3 (Phase 4 MD §4 extends with L_S/L_A)
loss:
  lambda_inv: 25.0      # JEPA invariance (MSE on masked tokens)
  lambda_var: 25.0      # VICReg variance penalty
  lambda_cov: 1.0       # VICReg covariance penalty
  lambda_scalar: 1.0    # scalar L1 on unknown positions
  lambda_occ: 1.0       # occupancy BCEWithLogits on masked pixels (§4.1,
                        # operator decision 2026-09-13: the decoder must be
                        # supervised even while lambda_phys = 0)
  lambda_phys: 0.1      # physics loss ACTIVE (operator decision 2026-09-13).
                        # Stage C, "tiny training with small physics loss"
                        # (03_training_and_objective.md §5), ramped from zero.
                        # The value sits at the low end of the diagnostic
                        # protocol's sweep range {0.01, 0.1, 1, 10}
                        # (scripts/diagnostics/protocol_v1/step7_lambda_sweep.py);
                        # raise it only on evidence, one change per commit.
                        # Rationale: L_phys is the only term that supervises the
                        # DECODED GEOMETRY against the true spectrum, so it is the
                        # mechanism that must make the conditioning content-
                        # sensitive rather than a mere presence switch (see the
                        # 20k-step finding in checkpoints/unified/REPORT.md §9.3).
  gamma: 1.0            # VICReg variance hinge threshold
  eps: 1.0e-4           # VICReg numerical epsilon
  scalar_loss_type: l1  # "l1" (default) or "huber" — wired (audit B17)

# Mask curriculum (Phase 3 MD §4)
curriculum:
  # TRAINING mask ratios: 0.0 is deliberately EXCLUDED — with zero masked
  # tokens the masked-token VICReg/JEPA objective is undefined (variance/
  # covariance require N>=2 valid samples). This exclusion is now explicit
  # in the config (cleanup item 3), not a silent runtime filter.
  train_mask_ratios: [0.25, 0.5, 0.75, 1.0]   # low → medium → high → full
  train_mask_ratio_probs: [0.25, 0.35, 0.25, 0.15]
  # EVALUATION mask ratios: 0.0 IS included here as the genuinely unmasked
  # reference condition. Consumed by scripts/diagnostics/run_guidance_gap_sweep.py
  # (the trainer's validation uses the easy/hard strata below, audit B6/B17).
  eval_mask_ratios: [0.0, 0.25, 0.5, 0.75, 1.0]
  mask_placement: random      # "random" or "half_sensitivity" (architecture_v5.md §2)
  scalar_regimes: ["all_known", "all_unknown", "mixed"]
  scalar_regime_probs: [0.34, 0.33, 0.33]
  # Phase 3 MD §4 / architecture_v5.md §8.3: validation strata, reported
  # separately and never pooled (audit B6).
  # easy: low occupancy mask + all scalars known.
  # hard: full occupancy mask + all scalars unknown (pure inverse design) —
  #       the stratum the real-vs-shuffled / scalar-dependence gates apply to.
  # NOTE: a 0.0 mask ratio is NOT a valid loss stratum — with zero masked
  # tokens the masked-token VICReg/JEPA objective is undefined (variance/
  # covariance require N>=2 valid samples). An unmasked reference, if wanted,
  # belongs to a dedicated diagnostic, not to validation losses.
  easy_mask_ratio: 0.25
  hard_mask_ratio: 1.0

# Physics loss staging (Phase 3 MD §5, extended Phase 4 MD §4.1)
staging:
  phase: C             # A=smoke, B=tiny no-phys, C=tiny small-phys, D=controlled (CFG+ramp), E=scale
                       # Operator decision 2026-09-13: B -> C now that the
                       # pre-activation checks are green (physics_use_ste verified
                       # load-bearing against the released surrogate, physics-alive
                       # assertion in preflight, degenerate-spectrum guard measured
                       # as unreachable). See checkpoints/unified/REPORT.md §7.
  lambda_phys_ramp_steps: 500  # ramp lambda_phys 0 -> 0.1 over the first 500 steps
                       # (03_training_and_objective.md §5: "Ramp lambda_phys from
                       # zero. Do not immediately turn on a large physics loss.")
  physics_use_ste: true      # REQUIRED with lambda_phys > 0, and now enforced:
                             # the soft path is a silent dead end (0 student params
                             # with gradient, L_phys 18.58 healthy-looking, soft
                             # field 96% out of distribution). Verified by
                             # soft_hard_occupancy_test against the real surrogate.

weights:
  spectrum: data/metadit/weights/spec_encoder.pth
  surrogate: data/metadit/weights/surrogate_model.bin  # released forward EM surrogate (frozen, §1.6)

data:
  train_split: data/metadit/split_data/train_set.mat
  val_split: data/metadit/split_data/val_set.mat
  max_train_samples: 0
  num_workers: 0         # passed to the DataLoaders (audit B17: was ignored)
  # Synthetic mode is CLI-only (--use-synthetic-smoke); there is deliberately
  # no config key for it (audit B17).

train:
  batch_size: 2
  grad_accum: 1
  # (no `epochs` key: the loop is step-based, audit B17)
  lr: 3.0e-4
  wd: 1.0e-4
  warmup_steps: 100
  total_steps: 1500
  val_every_steps: 50
  log_every_steps: 10
  ckpt_every_steps: 100
  clip_grad_norm: 1.0
  seed: 42
  val_batches: 1
  device: cpu
  # Phase 4 MD §3.5.1: classifier-free goal guidance
  guidance_dropout: 0.1   # probability of null-goal replacement during training
